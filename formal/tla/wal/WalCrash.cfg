\* Task 1-2 baseline, SingleWriter: three-phase commit + crash + recovery.
\* Strict scan (SinkKind = FsWrite), so a torn tail costs the whole log.
\* Read a green here only after Vacuity.cfg AND VacuityCrash.cfg have
\* gone red.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "SingleWriter"
  MUTATION = "NONE"
