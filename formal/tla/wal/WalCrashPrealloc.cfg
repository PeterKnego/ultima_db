\* Task 2 baseline, MultiWriter + CoalescedPrealloc. This is the ONLY
\* committed config in which Store::recover passes tail_tolerant = true
\* (src/store.rs:1073-1078), so it is the only one that reaches the
\* tolerant half of scan_wal (src/wal.rs:678-680) -- recovery truncating
\* at a torn tail and carrying on. Under FsWrite/Coalesced that branch is
\* unreachable and RecoverySound is green over dead code there; measured,
\* not assumed (Task 2 report, scratch assertion R5). It is also the
\* branch M4 attacks in Task 5.
\* Read a green here only after VacuityCrashPrealloc.cfg has gone red.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
INVARIANT TailTolerance
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
