\* CALIBRATION M2 -- task15 "Promotion ordering", failure mode 2:
\* MultiWriter disjoint-table commits erased each other. There was no
\* PromoteGate, so a commit promoted when its own fsync wait finished --
\* completion order, not ticket order. Per-table locks do not overlap for
\* disjoint tables, so writer B's fork ran while writer A's snapshot was
\* still unpromoted, and B's higher-versioned snapshot lacked A's table
\* wholesale.
\*
\* MUST BE VIOLATED (TLC exit 12). This is WalCrashMW.cfg -- the committed
\* MultiWriter baseline -- with the ONE constant changed.
\*
\* MUTATION = "M2" drops GateApplies, so Promote may pick any parked
\* commit rather than only the FIFO head.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M2"
