\* CALIBRATION M1 -- task15 "Promotion ordering", failure mode 1:
\* SingleWriter exclusivity broke. The pre-fix commit decremented
\* active_writer_count in phase 1, before the fsync wait, so begin_write
\* admitted a second writer while the first was still parked; it forked from
\* a latest that lacked the parked commit, and whichever promoted at the
\* higher version silently erased the other. Both commit()s returned Ok and
\* the WAL held both, so recovery diverged from live state.
\*
\* MUST BE VIOLATED (TLC exit 12). This is WalCrash.cfg -- the committed
\* SingleWriter baseline -- with the ONE constant changed, so a green here
\* means the baseline's protection is not the thing being checked.
\*
\* MUTATION = "M1" drops only the `parked = <<>>` conjunct of
\* WriterSlotFree; one writer at a time before submission is unchanged.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "SingleWriter"
  MUTATION = "M1"
