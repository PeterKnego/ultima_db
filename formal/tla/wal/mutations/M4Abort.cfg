\* CALIBRATION M4, THE HARM OF THE ABORT, IN ISOLATION.
\*
\* mutations/M4.cfg shows the abort (TailTolerance clause 1: recover()
\* returned Err on a torn tail). This config shows what the abort COSTS:
\* StrictScanErrLosesDurableAck, the owed property already committed for the
\* strict sinks (StrictScanErr.cfg), goes red here too -- a commit whose
\* commit() returned Ok under Durability::Consistent, whose frame is on disk
\* and CRC-clean, is unreachable because a LATER frame tore and the scan
\* refused to open the store.
\*
\* The pairing is the point, and it is the same shape as
\* modes/EventualFsWriteLossCanary.cfg + modes/ConsistentAckKeptCheck.cfg:
\* modes/ConsistentPreallocScanErrCheck.cfg runs THIS INVARIANT with the one
\* constant changed back to MUTATION = "NONE" and must come back CLEAN. So
\* the pair says something the abort alone does not -- tail tolerance is
\* precisely what buys the prealloc sink immunity from an availability gap
\* the DEFAULT Standalone configuration still has. Remove the tolerance and
\* the immunity goes with it.
\*
\* MUST BE VIOLATED (TLC exit 12).
SPECIFICATION Spec
INVARIANT StrictScanErrLosesDurableAck
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M4"
