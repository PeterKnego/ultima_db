\* CALIBRATION M3, DUPLICATE-VERSION CLAUSE IN ISOLATION.
\*
\* task15 mode 3's documented SYMPTOM is the duplicate: "two writers could
\* both be bumped to the same version, and the second snapshots.insert(v, ..)
\* silently replaced the first". mutations/M3.cfg violates PromotionFaithful
\* at MaxCommits = 2, but through the ORDERING clause, not this one -- TLC
\* stops at the shallowest counterexample and the ordering break is shallower.
\* A conjunction cannot tell those apart, so the documented symptom gets its
\* own config.
\*
\* It checks NoDupLive, NOT NoDuplicateVersion: after a crash `promoted` is
\* the REPLAY sequence, not the Rust's snapshot chain, so a duplicate found
\* there is a WAL duplicate -- real, and a consequence of the same bug, but a
\* different statement from "the second snapshots.insert(v, ..) silently
\* replaced the first". NoDuplicateVersion's shallowest counterexample is
\* exactly that: a post-Recover chain at depth 11. NoDupLive switches the
\* claim off once `crashed`, so what it reports is the CRASH-FREE snapshot
\* chain -- depth 12, all three commit()s returned Ok, two live snapshots at
\* the same version.
\*
\* MUST BE VIOLATED (TLC exit 12). MaxCommits = 3 is REQUIRED and is not a
\* margin: the duplicate needs a commit to promote (raising latestVersion
\* above two still-open writers' candidate versions) and then BOTH of those
\* writers to submit while the first of them is parked in the fsync wait, so
\* latestVersion does not move between the two bumps and both land on
\* latestVersion + 1. That is three commits. Measured: at MaxCommits = 2 this
\* invariant is exit 0 -- the duplicate is not reachable, and reading that as
\* a failed calibration would be reading a bounds artifact.
\* Paired control: mutations/CalibrationControl3.cfg (MUTATION = "NONE").
SPECIFICATION Spec
INVARIANT NoDupLive
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 3
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M3"
