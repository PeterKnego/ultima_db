\* CALIBRATION M5 -- task37 §4 invariant 2, the barrier discipline:
\* "Batch does not fit -> extend capacity by ceil(needed/chunk) chunks of
\* zero-fill + sync_all (NEW SIZE MUST BE DURABLE BEFORE USE), THEN write the
\* batch + sync_data." M5 is a PreallocFileSink that writes the batch into
\* the freshly grown region under a bare sync_data -- i.e. one that skips
\* preallocate_to's sync_all (src/wal.rs:549) or issues it after the write at
\* :1046 rather than before it at :1042. The record is then covered by a data
\* barrier while the file SIZE it lives past is not, so a crash takes it
\* WHOLESALE: the filesystem may still present the old size and those offsets
\* simply are not there.
\*
\* MUST BE VIOLATED (TLC exit 12). This is WalCrashPrealloc.cfg -- the
\* committed CoalescedPrealloc baseline -- with the ONE constant changed.
\*
\* This config reports the SHALLOWEST break, which is PreallocInvariant
\* clause (2) (`writeHead <= syncedCapacity`) -- the discipline itself,
\* stated directly. The HARM the discipline exists to prevent (an acked
\* Consistent commit lost across a crash) is RecoverySound, and it is carried
\* in the production extend-from-a-live-log shape by mutations/M5Strand.cfg;
\* at this bound every Extend fires from capacity = 0 on an empty log.
\*
\* MUTATION = "M5" drops the `metaDurable` conjunct of SyncData and nothing
\* else. SyncAll, Extend and the crash frontier are untouched.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
INVARIANT TailTolerance
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M5"
