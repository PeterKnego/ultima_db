\* CALIBRATION M4 -- task37 §7, the tail-tolerant-recovery subtlety:
\* a STRICT scan applied to a preallocated WAL. Preallocation puts a
\* partially-written record in front of durable zeros, so a torn tail LOOKS
\* like a complete frame whose CRC fails. Under the pre-task37 rule (CRC
\* mismatch -> Error::WalCorrupted, src/wal.rs:589-591) Store::recover
\* propagates that with `?` (src/store.rs:1023) BEFORE applying any entry --
\* so a legal, harmless torn tail costs the store its whole log and the
\* store refuses to open. That is exactly the abort task37 §7 introduced
\* `scan_wal(path, tail_tolerant)` to prevent.
\*
\* MUST BE VIOLATED (TLC exit 12). This is WalCrashPrealloc.cfg -- the
\* committed CoalescedPrealloc baseline -- with the ONE constant changed, so
\* a green here means the baseline's tolerance is not the thing being
\* checked. Paired reachability canary:
\* modes/ConsistentPreallocTornTailCanary.cfg, which proves recovery really
\* does truncate at a TORN frame (not merely a short one) under
\* MUTATION = "NONE"; without it TailTolerance could be green over a state
\* space with no torn tail in it.
\*
\* MUTATION = "M4" drops the CoalescedPrealloc arm of TailTolerant, i.e. the
\* tolerance selection at src/store.rs:1017-1022. Nothing else changes: the
\* sink still preallocates, still sync_data's in steady state, still grows by
\* chunks. Only the scan mode moves.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PreallocInvariant
INVARIANT TailTolerance
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M4"
