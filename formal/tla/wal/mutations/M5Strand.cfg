\* CALIBRATION M5, ACKED-LOSS CLAUSE IN ISOLATION, IN THE PRODUCTION SHAPE.
\*
\* mutations/M5.cfg proves the mutation is CAUGHT, but its shallowest
\* counterexample is PreallocInvariant -- the barrier discipline breaking,
\* which is the mechanism rather than the damage. task37 §4 invariant 2 has a
\* damage clause too ("new size must be durable before use"), and the damage
\* is a Consistent-acked commit that does not survive the crash. That is
\* RecoverySound's clause (b), and it gets its own config for the same reason
\* M2Fork.cfg and M3Dup.cfg exist: TLC stops at the shallowest violation, so
\* a conjunction cannot tell the mechanism from the harm.
\*
\* It checks NoAckLossAfterLiveExtend, not RecoverySound. Bare RecoverySound
\* is violated here too (depth 8), but its shallowest counterexample is the
\* FRESH-FILE extend -- capacity 0 -> one chunk on the first batch after
\* open -- which is available at MaxCommits = 2 and is not the shape a
\* running store lives in. The restricted clause demands
\* `syncedCapacity >= ChunkSize`: a whole chunk was already sync_all-covered
\* before the extend that lost the commit, i.e. preallocate_to zero-filling a
\* SUFFIX of an existing file (src/wal.rs:624-639 with from != 0), which is
\* the steady-state -> extend transition.
\*
\* MaxCommits = 3, deliberately, and it is not a margin: bound 3 is the ONLY
\* committed bound that reaches an extend from a NON-EMPTY log at all
\* (modes/ConsistentPrealloc3.cfg's header, and NoExtendFromLiveLog /
\* NoSecondChunk are exit 0 at 2 and exit 12 at 3). This is
\* modes/ConsistentPrealloc3.cfg with the ONE constant changed, and that
\* config is therefore its same-bound, same-shape, MUTATION = "NONE" control
\* -- it carries NoAckLossAfterLiveExtend and is gated clean at exit 0.
\*
\* MUST BE VIOLATED (TLC exit 12).
SPECIFICATION Spec
INVARIANT NoAckLossAfterLiveExtend
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 3
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M5"
