\* CALIBRATION M3 -- task15 "Promotion ordering", failure mode 3:
\* Duplicate versions. The auto-version bump compared against
\* latest_version, which lags while commits are parked in the fsync wait, so
\* two writers could both be bumped to the same version and the second
\* snapshots.insert(v, ..) silently replaced the first.
\*
\* MUST BE VIOLATED (TLC exit 12).
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M3"
