\* CALIBRATION M6 -- RecoverySound clause (c), "the recovered state replays no
\* torn frame". Real scan_wal is a sequential offset walk that STOPS at the
\* first frame it cannot accept: a CRC mismatch is `break` under tail_tolerant
\* (src/wal.rs:702-704) and `return Err(WalCorrupted)` without it (:705-707).
\* Either way the torn frame, and everything past it, is never replayed --
\* which is the entire content of clause (c). M6 deletes that stop, keeping
\* only the end-of-log stop (zero len-prefix / short tail, src/wal.rs:692-697),
\* so a torn frame is taken as good and replayed. That is the
\* corruption-passes-CRC failure the break/return Err exists to prevent: half a
\* commit record applied to the store, with recovery reporting success.
\*
\* MUST BE VIOLATED (TLC exit 12). This is modes/ConsistentPrealloc.cfg -- the
\* committed Consistent x CoalescedPrealloc mode config -- with the ONE
\* constant changed and the invariant list left ALONE, so a green here would
\* mean clause (c) is not the thing being checked. TypeOK, PromotionFaithful,
\* PreallocInvariant and TailTolerance stay in the list even though M6 breaks
\* none of them: dropping them would make the config differ from its baseline
\* in two ways instead of one, and "one constant changed" is the whole
\* argument that the red is the mutation's doing. Its same-bound,
\* same-shape MUTATION = "NONE" control IS modes/ConsistentPrealloc.cfg,
\* already committed and already gated clean at exit 0.
\*
\* WHY THIS CONFIG AND NOT WalCrashPrealloc.cfg: the two differ only by
\* SYMMETRY (this one declares TableSymmetry). Both go red on RecoverySound at
\* depth 9 with the same mechanism; the symmetric one is the smaller state
\* space and is the one whose clean control is a single committed file.
\*
\* ONE SIDE EFFECT, for whoever re-homes this config: NoTornTailTruncation --
\* the reachability canary at modes/ConsistentPreallocTornTailCanary.cfg, which
\* MUST go red at MUTATION = "NONE" -- flips to HOLDING under M6 (measured:
\* exit 0, 281 distinct). That is the same sentence as the mechanism, not an
\* independent effect: the canary demands that recovery truncated AT a torn
\* frame, and M6 is precisely the deletion of that truncation. No committed
\* config combines the two, so there is no gate impact today; a future config
\* that did would see a green reachability canary and should not read it as the
\* canary having gone dead.
\*
\* WHY A TOLERANT SINK: on a strict sink the deleted stop is also the strict
\* abort, so M6 would additionally suppress ScanFails and the red could be
\* argued to come from the missing abort rather than the replayed tear. Under
\* CoalescedPrealloc recovery already never aborts, so the ONLY observable
\* change M6 makes is that the scan keeps going past the tear -- exactly the
\* mechanism clause (c) forbids, and nothing else.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
INVARIANT TailTolerance
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M6"
