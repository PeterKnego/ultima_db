\* CALIBRATION M7 -- RecoverySound clause (a), "the recovered state is the
\* replay of a PREFIX OF SUBMISSION ORDER", matched position by position on
\* cid, version and table. Real recovery gets that identity from the frame:
\* scan_wal returns records in offset order (src/wal.rs:662-695) and
\* Store::recover applies each to the table its own entry names
\* (src/store.rs:1064-1067), so position i of the recovered chain carries
\* submission i's row. M7 swaps the (cid, tbl) identity of chain positions 1
\* and 2 and changes NOTHING else -- ver, sub and forkedFrom stay exactly as
\* the correct Replay computed them. That is a replay that applies commit 2's
\* row where commit 1's belongs: the store comes back up with the right
\* versions, the right fork chain and the wrong rows in them.
\*
\* WHY IDENTITY AND NOT ORDER. A bare reversal of the replayed list was tried
\* first and rejected: reversing drags the VERSIONS down with it, so
\* PromoteOrderIsSubmitOrder, ForkFromPromotePredecessor and RecoverySound
\* clause (d) all go red at the same depth, and the red is then as much about
\* the neighbouring properties as about clause (a) -- the "merely violating"
\* outcome M2 and M3 land in on their primary configs. Permuting identity
\* alone leaves versions strictly monotone and the fork chain intact, so
\* clause (a) fails ALONE. Measured by isolating all four clauses and running
\* each by itself: (a) red at depth 9, (b) (c) (d) exit 0, PromotionFaithful
\* exit 0 at the control's own state count. See the Task 5c report.
\*
\* MUST BE VIOLATED (TLC exit 12). This is modes/ConsistentPrealloc.cfg -- the
\* committed Consistent x CoalescedPrealloc mode config -- with the ONE
\* constant changed and the invariant list left ALONE, so a green here would
\* mean clause (a) is not the thing being checked. TypeOK, PromotionFaithful,
\* PreallocInvariant and TailTolerance stay in the list even though M7 breaks
\* none of them: that is the point. Dropping them would make the config differ
\* from its baseline in two ways instead of one, and "one constant changed" is
\* the whole argument that the red is the mutation's doing; keeping
\* PromotionFaithful in particular is what makes "the fork chain and the
\* version order survived the permutation" a CHECKED fact rather than a claim
\* in this header. Its same-bound, same-shape MUTATION = "NONE" control IS
\* modes/ConsistentPrealloc.cfg, already committed and already gated at exit 0.
\*
\* WHY THIS CONFIG: the same reason M6.cfg uses it. WalCrashPrealloc.cfg is the
\* same store without SYMMETRY; this one is the smaller state space and its
\* clean control is a single committed file.
\*
\* NOTE FOR WHOEVER RE-HOMES THIS. M7 needs a chain of at least TWO replayed
\* entries -- a permutation of one element is not a permutation, and the arm
\* is guarded on Len >= 2. At MaxCommits = 1, or on any config whose crash can
\* only ever leave one live frame, M7 is the identity and this config would go
\* GREEN while looking like it was checking something. MaxCommits = 2 is the
\* minimum bound that carries it, not a margin.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
INVARIANT TailTolerance
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M7"
