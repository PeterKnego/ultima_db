\* CONTROL for mutations/M2Fork.cfg and mutations/M3Dup.cfg. Same bound, same
\* store, MUTATION = "NONE".
\*
\* MUST BE CLEAN (TLC exit 0). Those two configs check ONE clause of
\* PromotionFaithful each, in isolation, at a bound no other committed config
\* uses for this store shape (MultiWriter + FsWrite + MaxCommits = 3). Without
\* this control, a red there could be the bound or the store shape rather than
\* the mutation. Green here says the clause holds at the same bound when the
\* mutation is switched off, so the red is the mutation's doing.
SPECIFICATION Spec
INVARIANT ForkFromPromotePredecessor
INVARIANT NoDuplicateVersion
INVARIANT PromotionFaithful
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 3
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
