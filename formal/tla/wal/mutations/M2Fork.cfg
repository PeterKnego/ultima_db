\* CALIBRATION M2, FORK-CHAIN CLAUSE IN ISOLATION.
\*
\* Task 1's review asked whether M2 needs a per-table last-writer map, since
\* PromotionFaithful never reads table identity and M2's documented symptom
\* is "B's higher-versioned snapshot lacked A's table wholesale". It does
\* not, and this config is why:
\*
\*   - the model has no per-table locking, so EVERY MultiWriter interleaving
\*     it explores is already the disjoint-table interleaving (the case
\*     where per-table locks fail to serialise the two commits);
\*   - ForkFromPromotePredecessor pins each promotion's fork source to its
\*     promotion predecessor, so a promotion that forks CORRECTLY cannot
\*     have erased anything, and one that erased something must have forked
\*     from a latest that lagged -- which is a broken fork chain.
\*
\* So the fork-source proxy is exactly as strong as the table statement for
\* the erasures M1-M5 produce. The residual is a mutation that installs the
\* WRONG TABLE SET at a correct version with a correct fork chain; that is
\* invisible here, and none of M1-M5 does it.
\*
\* MUST BE VIOLATED (TLC exit 12). MaxCommits = 3, deliberately: at 2 this
\* clause is TOOTHLESS -- breaking the fork chain needs a THIRD promotion to
\* observe (promotion 2 out of order leaves latestVersion at the max, and
\* only promotion 3 then forks from a version that is not its predecessor's).
\* Measured: M2 at MaxCommits = 2 leaves this clause HOLDING (exit 0) and
\* violates only the two ordering clauses. Paired control:
\* mutations/CalibrationControl3.cfg, same bound, MUTATION = "NONE", clean.
SPECIFICATION Spec
INVARIANT ForkFromPromotePredecessor
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 3
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "M2"
