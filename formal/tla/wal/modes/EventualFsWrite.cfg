\* DURABILITY MATRIX (Task 3). One config per Durability x WalWrite
\* combination the Standalone pipeline actually offers. Symmetry on table
\* identity: no action or invariant inspects a table value, they are only
\* compared for equality, so TLC may quotient by Permutations(Tables). The
\* Task 1-2 baselines in the parent directory deliberately do NOT declare
\* symmetry, so their committed state counts stay comparable across tasks.
\*
\* Eventual x WalWrite::PerEntry. commit() returns as soon as the
\* snapshot is promoted, with the WAL entry still only buffered, so
\* LOSING AN ACKED COMMIT IS PERMITTED here. RecoverySound still holds
\* because its acked-containment clause is gated on DurableAck -- which
\* is exactly why EventualHonest is listed too: it states the promise
\* Eventual DOES make (submission-order prefix, nothing partial).
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
INVARIANT EventualHonest
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Eventual"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
