\* TORN-TAIL REACHABILITY CANARY (Task 5). MUST BE VIOLATED (TLC exit 12).
\*
\* modes/ConsistentPrealloc.cfg with one invariant swapped in.
\* NoTornTailTruncation asserts that recovery never stops at a TORN frame and
\* carries on -- i.e. that the tolerant half of scan_wal (src/wal.rs:702-704)
\* is dead code. It must go red: TailTolerance and mutations/M4.cfg are both
\* about that branch, and if nothing reaches it, TailTolerance is green over
\* a state space containing no torn tail and M4 attacks nothing.
\*
\* It demands specifically a TORN stop. An ABSENT frame -- a zero len-prefix
\* or a short tail -- is a clean end-of-log in BOTH scan modes
\* (src/wal.rs:692-697, unconditional break), so reaching only that case
\* would prove nothing about tolerance.
\*
\* Task 2 measured the same fact with a scratch assertion and recorded it in
\* prose (see WalCrashPrealloc.cfg's header, "assertion R5"). Prose is not a
\* gate. Under FsWrite/Coalesced this invariant HOLDS -- the strict scan
\* errors out instead of truncating -- which is why the canary lives on the
\* prealloc config and why the third baseline exists at all.
SPECIFICATION Spec
INVARIANT NoTornTailTruncation
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
