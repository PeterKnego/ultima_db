\* DURABILITY MATRIX (Task 3). One config per Durability x WalWrite
\* combination the Standalone pipeline actually offers. Symmetry on table
\* identity: no action or invariant inspects a table value, they are only
\* compared for equality, so TLC may quotient by Permutations(Tables). The
\* Task 1-2 baselines in the parent directory deliberately do NOT declare
\* symmetry, so their committed state counts stay comparable across tasks.
\* Paired canary 2 of 2. MUST be violated: an Eventual ack really is
\* lost by some behaviour. Without it EventualHonest could be green over
\* runs that never visited the case distinguishing Eventual from
\* Consistent. The same invariant HOLDS under every Consistent /
\* ConsistentInline config -- see modes/ConsistentAckKeptCheck.cfg.
SPECIFICATION Spec
INVARIANT NoEventualAckLoss
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Eventual"
  SinkKind = "FsWrite"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
