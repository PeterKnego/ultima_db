\* DURABILITY MATRIX (Task 3). One config per Durability x WalWrite
\* combination the Standalone pipeline actually offers. Symmetry on table
\* identity: no action or invariant inspects a table value, they are only
\* compared for equality, so TLC may quotient by Permutations(Tables). The
\* Task 1-2 baselines in the parent directory deliberately do NOT declare
\* symmetry, so their committed state counts stay comparable across tasks.
\*
\* MaxCommits = 3, the ONLY committed config that reaches an extend from
\* a non-empty log -- i.e. the production shape: records already durable,
\* the next batch overruns the zero region, preallocate_to zero-fills a
\* SUFFIX of an existing file (src/wal.rs:536-551 with from != 0) and
\* need.div_ceil(chunk)*chunk (:1041) is evaluated across a chunk
\* boundary. At MaxCommits = 2 there is exactly one Extend per behaviour
\* and it always fires from capacity = 0, so none of that happens; the two
\* canaries below are exit 0 there and exit 12 here.
\* This is the region M5's already-durable-and-acked failure lives in.
\* Costs ~2 s, inside the plan's <= 4-commit bound.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT PreallocInvariant
INVARIANT RecoverySound
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 3
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
