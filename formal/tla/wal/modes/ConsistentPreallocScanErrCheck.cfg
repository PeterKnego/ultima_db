\* PAIRED CLEAN CONTROL for mutations/M4Abort.cfg. MUST BE CLEAN (exit 0).
\*
\* Same invariant, same bound, same store, MUTATION = "NONE".
\* StrictScanErrLosesDurableAck is the committed OWED PROPERTY that a torn
\* tail costs a strict-scan store its whole log, durable acked commits
\* included (StrictScanErr.cfg, red on the DEFAULT Standalone config). Here
\* it is CLEAN -- the tolerant scan Store::recover selects for
\* CoalescedPrealloc (src/store.rs:1073-1078) means recover() never returns
\* Err at all, so the gap does not exist on this sink.
\*
\* Read this row together with mutations/M4Abort.cfg's: the two differ in one
\* constant and disagree, which is what turns "tail tolerance matters" from
\* an assertion into a measurement. Same discipline as
\* modes/ConsistentAckKeptCheck.cfg, which does this for NoEventualAckLoss.
SPECIFICATION Spec
INVARIANT StrictScanErrLosesDurableAck
SYMMETRY TableSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "CoalescedPrealloc"
  ChunkSize = 2
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
