\* Task 1-2 baseline, MultiWriter: three-phase commit + crash + recovery.
\* This is the config that actually exercises
\* the protocol: commits park while other writers proceed, the PromoteGate
\* FIFO holds more than one ticket, Fsync's batch-prefix nondeterminism
\* fires, and the max(latestVersion, lastSubmitted) version bump is live.
\* The SingleWriter config (WalCrash.cfg) is strictly serial by construction
\* and cannot reach any of that.
\* Read a green here only after VacuityMW.cfg AND VacuityCrashMW.cfg
\* have gone red.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PromotionFaithful
INVARIANT RecoverySound
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxCommits = 2
  Tables = {t1, t2}
  Durability = "Consistent"
  SinkKind = "FsWrite"
  WriterMode = "MultiWriter"
  MUTATION = "NONE"
