name: formal

# Formal-verification CI for the B-tree and the primary-key encoding (formal/).
#   * drift  — gates PRs: src/btree.rs and src/primary_key.rs may not diverge
#              from their Lean models unnoticed. Cheap (git + cargo only), so it
#              runs on every PR.
#   * lean   — rebuilds the Lean proofs and re-checks their axioms. Heavy (fetches
#              the pinned Aeneas/Charon/Lean toolchain), so it runs on a weekly
#              schedule and on demand only — never blocking a PR on a toolchain hiccup.

on:
  pull_request:
  # Also gate main directly: work merged locally and pushed (rather than via a
  # PR) would otherwise skip this check until the next Monday cron. Path-scoped
  # because `lean` is a ~30-minute proof build — only worth running on main when
  # something it actually verifies changed. (`drift` stays PR-only: it diffs
  # against the PR base, and on a main-push checkout its default base
  # `origin/main` equals HEAD, so it would pass vacuously.)
  push:
    branches: [main]
    paths:
      - 'src/btree.rs'
      - 'src/primary_key.rs'
      - 'formal/**'
      - '.github/workflows/formal.yml'
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the PR base commit for the range diff
      - name: Drift guard (src/btree.rs, src/primary_key.rs <-> formal/)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # Bypass for a watched-file change outside the verified surface
          # by putting [skip-formal-drift] in the PR title.
          ACK_NO_FORMAL: ${{ contains(github.event.pull_request.title, '[skip-formal-drift]') && '1' || '' }}
        run: formal/scripts/check-drift.sh
      - name: Kernel differential tests (vs std BTreeMap / reproduced impls)
        run: |
          make test/formal-kernel
          make test/formal-key-kernel

  lean:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Aeneas/Charon toolchain
        run: ./formal/scripts/fetch-toolchain.sh
      - name: Build proofs
        working-directory: formal/proofs
        run: lake build
      - name: Kernel differential tests (vs std BTreeMap / reproduced impls)
        run: |
          make test/formal-kernel
          make test/formal-key-kernel
      - name: Check axioms (no sorry; only propext/Classical.choice/Quot.sound)
        working-directory: formal/proofs
        run: |
          cat > _AxiomCheck.lean <<'EOF'
          import BtreeInsertInv
          import BtreeInsertGet
          import BtreeInsertFrame
          import RemoveInv
          import RemoveGet
          import RemoveFrame
          import RemoveTotal
          import MinKeysPreserve
          import KeyRoundTrip
          import KeyMonoFixed
          import KeyFraming
          #print axioms btree_kernel.BTree.insert_inv
          #print axioms btree_kernel.BTree.insert_get
          #print axioms btree_kernel.BTree.insert_frame
          #print axioms btree_kernel.BTree.remove_inv
          #print axioms btree_kernel.BTree.remove_get
          #print axioms btree_kernel.BTree.remove_frame
          #print axioms btree_kernel.BTree.remove_total
          #print axioms btree_kernel.BTree.remove_spec
          #print axioms btree_kernel.BTree.remove_minkeys
          #print axioms btree_kernel.BTree.remove_balanced_spec
          #print axioms key_kernel.decode_encode_u64
          #print axioms key_kernel.decode_encode_i64
          #print axioms key_kernel.escape_prefix_scan
          #print axioms key_kernel.unescape_escape
          #print axioms key_kernel.decode_encode_pair
          #print axioms key_kernel.encode_mono_u64
          #print axioms key_kernel.encode_mono_i64
          #print axioms key_kernel.sign_flip_order_iso
          #print axioms key_kernel.encode_inj_u64
          #print axioms key_kernel.encode_inj_i64
          #print axioms key_kernel.encode_mono_bytes
          #print axioms key_kernel.framed_prefix_lt_literal
          #print axioms key_kernel.framed_prefix_lt_escaped_zero
          #print axioms key_kernel.escaped_byte_order
          #print axioms key_kernel.framing_no_confusion
          #print axioms key_kernel.framing_no_confusion_kernel
          #print axioms key_kernel.framed_element_lex
          #print axioms key_kernel.encode_mono_pair
          #print axioms key_kernel.encode_mono_triple
          EOF
          lake env lean _AxiomCheck.lean 2>&1 | tee _axioms.txt
          rm -f _AxiomCheck.lean
          if grep -qiE 'sorryAx|sorry|admit' _axioms.txt; then
            echo "::error::proofs depend on sorry/admit — verification is incomplete"
            exit 1
          fi
