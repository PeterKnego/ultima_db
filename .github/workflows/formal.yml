name: formal

# Formal-verification CI for the B-tree, the primary-key encoding and the WAL
# crash-safety model (formal/).
#   * drift  — gates PRs *and* pushes to main: the watched src/*.rs files may not
#              diverge from their formal models unnoticed. Cheap (git + cargo
#              only), so it runs on every PR and on any main push that touches
#              one of them.
#   * tla    — gates PRs that touch the TLA+ WAL model: S0 toolchain canary plus
#              the S1 model (manifest + baselines + vacuity canaries + modes).
#              ~90s, jar is vendored, so it is a cheap PR gate. Path-scoped
#              in-job (see the job) rather than via on.pull_request.paths, which
#              is workflow-wide and would also silence `drift`.
#   * lean   — rebuilds the Lean proofs and re-checks their axioms. Heavy (fetches
#              the pinned Aeneas/Charon/Lean toolchain), so it runs on a weekly
#              schedule and on demand only — never blocking a PR on a toolchain hiccup.

on:
  pull_request:
  # Also gate main directly: work merged locally and pushed (rather than via a
  # PR) would otherwise skip these checks until the next Monday cron. That is
  # not hypothetical — task57's wal.rs refactor reached main that way and moved
  # every cite in formal/tla/ without anything noticing.
  #
  # The path list is the union of what the jobs below need, because a workflow
  # gets exactly one push filter. Per-job scoping is then done inside the jobs:
  # `drift` wants all five watched sources, while `lean` is a ~30-minute proof
  # build that verifies only the B-tree and key-encoding kernels — so it must
  # NOT fire for a wal.rs/store.rs/persistence.rs push. See `lean-scope`.
  push:
    branches: [main]
    paths:
      - 'src/btree.rs'
      - 'src/primary_key.rs'
      - 'src/wal.rs'
      - 'src/store.rs'
      - 'src/persistence.rs'
      - 'formal/kernel/**'
      - 'formal/key_kernel/**'
      - 'formal/proofs/**'
      - 'formal/scripts/**'
      # The TLA+ corpus itself, for `drift`'s cite check: a push that only adds
      # a cite (or drops the last one referencing a manifest row) touches no
      # watched source, and would otherwise reach no job at all. `lean` scopes
      # itself out of these — see `lean-scope`.
      - 'formal/tla/**'
      - '.github/workflows/formal.yml'
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    # PRs *and* direct-to-main pushes. Running on push is the whole point of
    # widening the filter above: a locally-merged push never sees the PR gate,
    # which is how task57 moved every formal/tla/ cite unnoticed.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the base commit for the range diff
      - name: Drift guard (watched src/*.rs <-> formal/)
        env:
          # On a PR, diff against the merge base. On a push, against the commit
          # the branch was at before it — `origin/main` would equal HEAD here
          # and the check would pass vacuously.
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
          # Bypass for a watched-file change outside the verified surface:
          # [skip-formal-drift] in the PR title, or in the pushed commit message.
          # The script tests for exactly "1", so the false branch must be empty.
          ACK_NO_FORMAL: >-
            ${{ (contains(github.event.pull_request.title, '[skip-formal-drift]')
                 || contains(github.event.head_commit.message, '[skip-formal-drift]'))
                && '1' || '' }}
        run: formal/scripts/check-drift.sh
      # The drift guard cannot see this class of rot: its predicate is "did
      # anything under formal/ change", which has no relation to whether the
      # cites were re-checked. c8c1f0a broke all 99 src/wal.rs cites and
      # satisfied the drift guard in the same commit, because it also touched
      # one unrelated line in RESULTS.md. This checks the cites themselves,
      # against the expectation tokens in formal/tla/wal/cite-anchors.tsv.
      # python3 + git only, well under a second — no reason not to run it on
      # every event the drift guard runs on. Needs the fetch-depth: 0 above,
      # because the frozen `<sha>^` rows are resolved with `git show`.
      - name: Cite guard (formal/tla/wal/ src/*.rs:LINE cites still point at what they claim)
        run: formal/scripts/check-cites.py
      - name: Kernel differential tests (vs std BTreeMap / reproduced impls)
        run: |
          make test/formal-kernel
          make test/formal-key-kernel

  tla:
    # PR gate for the TLA+ WAL crash-safety model (F-DB-2 S1). The tla2tools jar
    # is vendored under tools/tla/, so there is nothing to download; java is
    # provisioned per-job (Temurin 21, same as consistency.yml's Elle jobs).
    #
    # Path scoping is done in-job, not with `on.pull_request.paths`: that filter
    # applies to the whole workflow, so adding it would stop `drift` running on
    # PRs that do not touch formal/ — exactly the PRs drift exists to catch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the PR base commit for the path diff
      - name: Is the TLA+ model in scope for this PR?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE"...HEAD)"
          if printf '%s\n' "$changed" \
               | grep -qE '^(formal/tla/|tools/tla/|Makefile$|\.github/workflows/formal\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "TLA+ inputs changed — running the gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No TLA+ inputs changed — skipping."
          fi
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: TLA+ gates (S0 toolchain canary, then the S1 model)
        if: steps.scope.outputs.run == 'true'
        # formal/tla-model runs formal/tla-manifest first and formal/tla-modes
        # last, so this one target covers manifest + baselines + vacuity
        # canaries + the durability-matrix modes. ~90s total.
        run: make formal/tla-smoke && make formal/tla-model

  # The push filter above is the union of every job's inputs, so a push that
  # only touched src/wal.rs (or store.rs/persistence.rs) reaches this workflow
  # for `drift`'s sake — but `lean` verifies neither. Deciding that here keeps
  # the ~30-minute build off those pushes without gating each of its steps.
  # Schedule and workflow_dispatch always run: there is no diff to scope by.
  lean-scope:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Are the Lean inputs in scope for this run?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: nothing to scope by — running the proofs."
            exit 0
          fi
          if git diff --name-only "$BEFORE"...HEAD | grep -qE '^(src/btree\.rs|src/primary_key\.rs|formal/kernel/|formal/key_kernel/|formal/proofs/|formal/scripts/|\.github/workflows/formal\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Lean inputs changed — running the proofs."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Lean inputs changed — skipping the proof build."
          fi

  lean:
    needs: lean-scope
    if: needs.lean-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Aeneas/Charon toolchain
        run: ./formal/scripts/fetch-toolchain.sh
      - name: Build proofs
        working-directory: formal/proofs
        run: lake build
      - name: Kernel differential tests (vs std BTreeMap / reproduced impls)
        run: |
          make test/formal-kernel
          make test/formal-key-kernel
      - name: Check axioms (no sorry; only propext/Classical.choice/Quot.sound)
        working-directory: formal/proofs
        run: |
          cat > _AxiomCheck.lean <<'EOF'
          import BtreeInsertInv
          import BtreeInsertGet
          import BtreeInsertFrame
          import RemoveInv
          import RemoveGet
          import RemoveFrame
          import RemoveTotal
          import MinKeysPreserve
          import KeyRoundTrip
          import KeyMonoFixed
          import KeyFraming
          #print axioms btree_kernel.BTree.insert_inv
          #print axioms btree_kernel.BTree.insert_get
          #print axioms btree_kernel.BTree.insert_frame
          #print axioms btree_kernel.BTree.remove_inv
          #print axioms btree_kernel.BTree.remove_get
          #print axioms btree_kernel.BTree.remove_frame
          #print axioms btree_kernel.BTree.remove_total
          #print axioms btree_kernel.BTree.remove_spec
          #print axioms btree_kernel.BTree.remove_minkeys
          #print axioms btree_kernel.BTree.remove_balanced_spec
          #print axioms key_kernel.decode_encode_u64
          #print axioms key_kernel.decode_encode_i64
          #print axioms key_kernel.escape_prefix_scan
          #print axioms key_kernel.unescape_escape
          #print axioms key_kernel.decode_encode_pair
          #print axioms key_kernel.encode_mono_u64
          #print axioms key_kernel.encode_mono_i64
          #print axioms key_kernel.sign_flip_order_iso
          #print axioms key_kernel.encode_inj_u64
          #print axioms key_kernel.encode_inj_i64
          #print axioms key_kernel.encode_mono_bytes
          #print axioms key_kernel.framed_prefix_lt_literal
          #print axioms key_kernel.framed_prefix_lt_escaped_zero
          #print axioms key_kernel.escaped_byte_order
          #print axioms key_kernel.framing_no_confusion
          #print axioms key_kernel.framing_no_confusion_kernel
          #print axioms key_kernel.framed_element_lex
          #print axioms key_kernel.encode_mono_pair
          #print axioms key_kernel.encode_mono_triple
          EOF
          set -o pipefail
          lake env lean _AxiomCheck.lean 2>&1 | tee _axioms.txt
          rm -f _AxiomCheck.lean
          grep -qE "depends on axioms" _axioms.txt || { echo "::error::no axiom lines — check ran vacuously"; exit 1; }
          grep -E "depends on axioms" _axioms.txt \
            | grep -vE "\[propext(, (Classical\.choice|Quot\.sound))*\]$" \
            && { echo "::error::non-standard axiom"; exit 1; } || true
