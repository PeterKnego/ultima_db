name: ci

# Core build/test/lint gate for the root crate + ultima-vector.
#   * test — gates PRs (and pushes to main): clippy, then three test passes.
#     Default features are empty, so `--features persistence,fulltext,metrics`
#     is load-bearing for the main gate (it's the only pass that exercises the
#     persistence/fulltext/metrics code paths, incl. doc tests); `--lib` with
#     no features keeps the in-memory-only default build green; the
#     ultima-vector pass covers a workspace member that root `cargo test`
#     does not reach. ultima-vector clippy is included alongside the root
#     clippy pass since it currently passes clean with -D warnings. The
#     `--ignored` pass exists because plain `cargo test` skips the three
#     unresolved cells of tests/table_lifecycle_races.rs (six tests — each is
#     observed under both isolation levels), whose recorded behaviour their
#     doc comments cite — unrun, it silently rots. It is the only place
#     anything here passes `--ignored`; see `make test/lifecycle-races`.
#     Triaging a failure in THAT step differs from the others: those cells pin
#     an observation nobody has ruled on, so red means "an unruled cell's
#     behaviour changed" — re-read its doc comment and update the recorded
#     value if the new behaviour is better. Red in any other step is a bug.
#     The two `mutation-testing` steps are the same argument for the in-flight
#     WAL fault suite (task60): the feature is off in every other pass, so
#     without them all three tests/wal_fault_*.rs binaries compile nowhere and
#     gate nothing — including the one test that executes `1e5d2b7`'s `set_len`
#     rollback. They are split from the main pass because the feature set is
#     different, and split from each other because the torn-tail cell is
#     `#[ignore]`d for the same "awaiting a ruling" reason as the lifecycle
#     cells above; triage its red the same way. See `make test/wal-faults`.
# Deliberately NOT run here:
#   * compare_benches (RocksDB/Fjall/ReDB) — opt-in competitor tier, keeps
#     those deps out of CI by design (see `make bench/compare-engines`).
#   * --all-features — wal-iouring is not reliable on hosted runners.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (root crate)
        run: make lint
      - name: Clippy (ultima-vector)
        run: cargo clippy -p ultima-vector -- -D warnings
      - name: Tests (persistence, fulltext, metrics)
        run: cargo test --features persistence,fulltext,metrics
      - name: Tests (table-lifecycle races, --ignored cells)
        run: cargo test --features persistence,fulltext,metrics --test table_lifecycle_races -- --ignored
      # --test-threads=1 is required, not cosmetic: these binaries also host
      # src/test_scratch.rs's #[test] fns, and the fault tests set ULTIMA_MUTATION
      # with `unsafe { env::set_var }` while scratch_dir()/Store::new read the
      # environment. Concurrent getenv/setenv is UB. (It does NOT substitute for
      # one mutation value per binary — see tests/wal_fault_*.rs module docs.)
      - name: Tests (in-flight WAL faults)
        run: |
          cargo test --features persistence,fulltext,mutation-testing \
            --test wal_fault_failed_extend --test wal_fault_fsync \
            --test wal_fault_torn_tail -- --test-threads=1
      # A libtest filter matching zero tests exits 0, so `-- --ignored` alone
      # would stay green if the F1 cell were deleted or de-ignored. No cargo or
      # libtest flag requires a non-zero match, so assert it against the output.
      - name: Tests (in-flight WAL faults, --ignored F1 cell)
        run: |
          set -o pipefail
          cargo test --features persistence,fulltext,mutation-testing \
            --test wal_fault_torn_tail -- --ignored --test-threads=1 \
            --exact a_torn_tail_costs_a_strict_scan_its_durably_acked_commits \
            | tee /tmp/f1.log
          grep -q '^test a_torn_tail_costs_a_strict_scan_its_durably_acked_commits \.\.\. ok$' /tmp/f1.log \
            || { echo "ERROR: the --ignored F1 cell did not run and pass (a zero-match filter exits 0)."; exit 1; }
      - name: Tests (no features)
        run: cargo test --lib
      - name: Tests (ultima-vector, persistence)
        run: cargo test -p ultima-vector --features persistence
